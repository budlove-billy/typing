<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><title>Mallow 15초 홍보 영상 렌더러</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>body{margin:0;background:#000}canvas{width:360px;height:640px}</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script>
/* ===== 플레이말로우 15초 세로 홍보 영상(1080×1920, 30fps) — 화면·소리 모두 여기서 결정적으로 만든다 =====
   tools/promo-video/render.mjs가 renderFrame(t)로 프레임을, renderAudio()로 WAV를 받아 ffmpeg로 합친다.
   구성(120BPM, 한 박 0.5초): 0~1.5 훅 · 1.5~9.5 게임 12컷(1초×4 → 0.5초×8로 점점 빨라짐) · 9.5~11.5 표지 벽+문구 3개 · 11.5~15 엔딩(주소·캐릭터·홈 화면, 끝까지 밝게). */
const W = 1080, H = 1920, FPS = 30, DUR = 15;
const cv = document.getElementById('c'), g = cv.getContext('2d');
const F = '"Pretendard Variable", Pretendard, "Malgun Gothic", sans-serif';
const ART = '/.logs/video/art/';
const GAMES = [
  ['run', '말로우 런', '순발력', '+120'], ['stroop', '색깔 맞추기', '집중력', 'PERFECT!'], ['merge', '말랑 2048', '계산', '+2048'], ['whack', '말로우 팡팡', '협응', 'COMBO!'],
  ['chop', '말로우 타워', '순발력', '+300'], ['react', '반응 속도', '순발력', '0.19초'], ['cards', '카드 짝', '기억력', 'MATCH!'], ['catch', '마시멜로 받기', '협응', '+80'],
  ['queens', '말로우 크라운', '오늘의 퍼즐', 'CLEAR!'], ['rhythm', '리듬 따라하기', '청각', 'GREAT!'], ['spot', '다른 색 찾기', '관찰력', 'FOUND!'], ['flash', '순간기억', '기억력', '+500'],
];
const SLOTS = []; { let s = 1.5; GAMES.forEach((x, i) => { const d = i < 4 ? 1 : 0.5; SLOTS.push({ s, d, g: x }); s += d; }); }
const WALL_T = 9.5, END_T = 11.5;
const ALL = ['anagram','bubble','cards','catch','chop','count','diff','fit','flank','flash','guess','iq','math','melody','merge','moamoa','nback','nono','odd','pitch','queens','react','rev','rhythm','rotate','run','slide','sort','spot','stroop','sudoku','switch','tango','trace','trail','whack','wordsearch'];
const IMG = {};
function load(key, src) { return new Promise(r => { const i = new Image(); i.onload = () => { IMG[key] = i; r(); }; i.onerror = () => r(); i.src = src; }); }
window.ready = (async () => {
  await Promise.all([...ALL.map(k => load(k, ART + k + '.jpg')), load('home', ART + 'home.png'),
    load('m1', ART + 'mallow-success-mint.svg'), load('m2', ART + 'mallow-happy-mint.svg'), load('m3', ART + 'mallow-success-sky.svg')]);
  try { await document.fonts.load('900 100px "Pretendard Variable"'); await document.fonts.load('700 60px "Pretendard Variable"'); } catch (e) {}
  return Object.keys(IMG).length;
})();

/* ---- 도구 ---- */
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const eOut = u => 1 - Math.pow(1 - clamp(u, 0, 1), 3);
const eBack = u => { u = clamp(u, 0, 1); const c = 1.9; return 1 + (c + 1) * Math.pow(u - 1, 3) + c * Math.pow(u - 1, 2); };
function rng(seed) { let s = seed >>> 0; return () => { s = (s + 0x6D2B79F5) >>> 0; let q = s; q = Math.imul(q ^ q >>> 15, q | 1); q ^= q + Math.imul(q ^ q >>> 7, q | 61); return ((q ^ q >>> 14) >>> 0) / 4294967296; }; }
function rr(x, y, w, h, r) { g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }
function cover(img, x, y, w, h, zoom, px, py) { if (!img) return; const s = Math.max(w / img.width, h / img.height) * (zoom || 1);
  const iw = img.width * s, ih = img.height * s; g.drawImage(img, x + (w - iw) / 2 + (px || 0), y + (h - ih) / 2 + (py || 0), iw, ih); }
// 쾅 박히는 글자: t0부터 0.16초 동안 크게→제자리, 살짝 튕김
function slamS(t, t0) { const u = (t - t0) / 0.16; return u >= 1 ? 1 : 1 + 0.7 * (1 - eOut(u)); }
function slamA(t, t0) { return clamp((t - t0) / 0.06, 0, 1); }
function txt(s, x, y, size, o) { o = o || {}; g.save(); g.translate(x, y); if (o.scale) g.scale(o.scale, o.scale); if (o.rot) g.rotate(o.rot);
  g.globalAlpha *= (o.alpha == null ? 1 : o.alpha); g.font = `${o.weight || 900} ${size}px ${F}`; g.textAlign = o.align || 'center'; g.textBaseline = 'middle';
  g.lineJoin = 'round';
  if (o.shadow !== false) { g.fillStyle = 'rgba(0,0,0,.45)'; g.fillText(s, 0, size * 0.07); }
  if (o.stroke) { g.strokeStyle = o.stroke; g.lineWidth = o.sw || size * 0.16; g.strokeText(s, 0, 0); }
  if (o.grad) { const gr = g.createLinearGradient(0, -size / 2, 0, size / 2); o.grad.forEach((c, i) => gr.addColorStop(i / (o.grad.length - 1), c)); g.fillStyle = gr; } else g.fillStyle = o.fill || '#fff';
  g.fillText(s, 0, 0); g.restore(); }
function flash(t, t0, a) { const u = (t - t0) / 0.1; if (u < 0 || u > 1) return; g.fillStyle = `rgba(255,255,255,${(1 - u) * (a || .7)})`; g.fillRect(0, 0, W, H); }
function vignette(a) { const gr = g.createRadialGradient(W / 2, H / 2, H * .3, W / 2, H / 2, H * .75); gr.addColorStop(0, 'rgba(0,0,0,0)'); gr.addColorStop(1, `rgba(8,4,24,${a})`); g.fillStyle = gr; g.fillRect(0, 0, W, H); }

/* ---- 표지 벽(훅 배경·9.5초 구간) ---- */
function wall(t, speed, alpha) { g.save(); g.globalAlpha = alpha; g.translate(W / 2, H / 2); g.rotate(-0.17);
  const tw = 250, th = 333, gap = 18, cols = 7, rows = 9, off = (t * speed) % (th + gap);
  for (let r = -1; r < rows; r++) for (let c = 0; c < cols; c++) {
    const k = ALL[((r + 40) * 3 + c * 5 + Math.floor(t * speed / (th + gap)) * 7) % ALL.length];
    const x = (c - cols / 2) * (tw + gap) + (r % 2 ? tw / 2 : 0), y = (r - rows / 2) * (th + gap) - off;
    g.save(); rr(x, y, tw, th, 22); g.clip(); cover(IMG[k], x, y, tw, th, 1); g.restore();
    g.strokeStyle = 'rgba(255,255,255,.35)'; g.lineWidth = 4; rr(x, y, tw, th, 22); g.stroke(); }
  g.restore(); }

/* ---- 장면 ---- */
function hook(t) {
  const gr = g.createLinearGradient(0, 0, 0, H); gr.addColorStop(0, '#5b3fd1'); gr.addColorStop(1, '#1d1740'); g.fillStyle = gr; g.fillRect(0, 0, W, H);
  wall(t + 3, 260, .55); g.fillStyle = 'rgba(22,14,60,.45)'; g.fillRect(0, 0, W, H);
  const sh = t < 1.5 ? Math.sin(t * 90) * 10 * Math.max(0, 1 - ((t % 0.5) / 0.12)) : 0;
  g.save(); g.translate(sh, 0);
  txt('너의 뇌,', W / 2, 700, 190, { scale: slamS(t, -0.08), alpha: slamA(t, -0.08), stroke: '#2a1466', grad: ['#ffffff', '#d9ccff'] });
  if (t >= 0.5) txt('몇 점이야?', W / 2, 930, 190, { scale: slamS(t, 0.5), alpha: slamA(t, 0.5), stroke: '#2a1466', grad: ['#fff3b0', '#ffb13b'] });
  if (t >= 1.0) { const u = (t - 1.0) / 0.5;
    g.save(); g.translate(W / 2, 1260); g.rotate(t * 1.5); for (let i = 0; i < 14; i++) { g.rotate(Math.PI / 7); g.fillStyle = `rgba(255,214,107,${0.18 * (1 - u * 0.5)})`; g.beginPath(); g.moveTo(0, 0); g.lineTo(-60, -900); g.lineTo(60, -900); g.fill(); } g.restore();
    txt('START!', W / 2, 1260, 230, { scale: slamS(t, 1.0), alpha: slamA(t, 1.0), stroke: '#8a2d00', grad: ['#fff7c2', '#ffcf3f', '#ff8a1f'], rot: -0.06 }); }
  g.restore(); vignette(.6); flash(t, 0.5, .5); flash(t, 1.0, .6);
}
function hud(t, i) {
  const u = clamp((t - 1.5) / 8, 0, 1), left = 1 - u, low = t > 7.5;
  g.fillStyle = 'rgba(12,8,34,.62)'; g.fillRect(0, 0, W, 250);
  const score = Math.round((i + 1) * 1234 + (t - SLOTS[i].s) * 800);
  txt('SCORE', 70, 78, 40, { align: 'left', fill: '#ffd27a', shadow: false });
  txt(score.toLocaleString(), 70, 148, 84, { align: 'left', fill: '#fff' });
  const cs = slamS(t, SLOTS[i].s); txt('COMBO', W - 70, 78, 40, { align: 'right', fill: '#8fd3ff', shadow: false });
  txt('×' + (i + 1), W - 70, 150, 96, { align: 'right', scale: cs, grad: ['#ffffff', '#8fd3ff'], stroke: '#123a6a', sw: 10 });
  const bx = 70, bw = W - 140, by = 205, bh = 26; g.fillStyle = 'rgba(255,255,255,.18)'; rr(bx, by, bw, bh, 13); g.fill();
  const pulse = low ? (0.75 + 0.25 * Math.sin(t * 25)) : 1;
  g.fillStyle = left > .45 ? '#4fe0a8' : left > .22 ? '#ffd23f' : `rgba(255,59,92,${pulse})`; rr(bx, by, Math.max(26, bw * left), bh, 13); g.fill();
  if (low) { g.fillStyle = `rgba(255,40,70,${0.18 * (0.5 + 0.5 * Math.sin(t * 25))})`; g.fillRect(0, 0, W, H); }
}
function games(t) {
  let i = SLOTS.length - 1; for (let k = 0; k < SLOTS.length; k++) if (t < SLOTS[k].s + SLOTS[k].d) { i = k; break; }
  const S = SLOTS[i], u = (t - S.s) / S.d, [id, name, cat, pop] = S.g, r = rng(i * 97 + 11);
  const shake = Math.max(0, 1 - (t - S.s) / 0.12) * 22;
  g.save(); g.translate((r() - 0.5) * shake, (r() - 0.5) * shake);
  cover(IMG[id], -20, -20, W + 40, H + 40, 1.16 - 0.1 * eOut(u), (r() - 0.5) * 80 * u, -40 * u);
  g.restore();
  const bot = g.createLinearGradient(0, H * .55, 0, H); bot.addColorStop(0, 'rgba(10,6,30,0)'); bot.addColorStop(1, 'rgba(10,6,30,.92)'); g.fillStyle = bot; g.fillRect(0, H * .55, W, H * .45);
  // 점수 팝업
  const pu = (t - S.s - S.d * 0.2) / (S.d * 0.7); if (pu > 0 && pu < 1) {
    txt(pop, W / 2, 900 - 260 * eOut(pu), 150, { scale: 0.6 + 0.5 * eBack(pu * 2), alpha: 1 - Math.max(0, pu - 0.7) / 0.3, grad: ['#fff7c2', '#ffcf3f', '#ff8a1f'], stroke: '#6a2400', rot: (r() - 0.5) * 0.2 }); }
  // 카테고리 칩 + 게임 이름
  const ns = slamS(t, S.s), na = slamA(t, S.s);
  g.save(); g.globalAlpha = na; g.font = `800 50px ${F}`; const cw = g.measureText(cat).width + 70;
  g.fillStyle = 'rgba(255,214,107,.95)'; rr(W / 2 - cw / 2, 1420, cw, 84, 42); g.fill(); g.restore();
  txt(cat, W / 2, 1463, 50, { weight: 800, fill: '#3a1a08', shadow: false, alpha: na });
  txt(name, W / 2, 1610, name.length > 6 ? 130 : 150, { scale: ns, alpha: na, stroke: '#2a1466', grad: ['#ffffff', '#e4dcff'] });
  hud(t, i); vignette(.35); flash(t, S.s, i < 4 ? .75 : .5);
}
function wallScene(t) {
  const gr = g.createLinearGradient(0, 0, 0, H); gr.addColorStop(0, '#2d1f6e'); gr.addColorStop(1, '#120c2e'); g.fillStyle = gr; g.fillRect(0, 0, W, H);
  const lt = t - WALL_T; wall(lt, 900 + lt * 900, 1); g.fillStyle = `rgba(14,8,40,${0.35 + lt * 0.12})`; g.fillRect(0, 0, W, H);
  const L = [['두뇌게임 34종', ['#ffffff', '#cfc0ff']], ['매일 새 퍼즐', ['#fff3b0', '#ffb13b']], ['오늘의 운세까지', ['#ffd6f0', '#ff7eb6']]];
  L.forEach(([s, c], k) => { const t0 = WALL_T + k * 0.6667; if (t < t0) return;
    g.fillStyle = 'rgba(10,6,30,.55)'; rr(90, 560 + k * 290 - 110, W - 180, 220, 40); g.fill();
    txt(s, W / 2, 560 + k * 290, 140, { scale: slamS(t, t0), alpha: slamA(t, t0), stroke: '#1b0f4a', grad: c }); });
  vignette(.55); [0, 1, 2].forEach(k => flash(t, WALL_T + k * 0.6667, .45));
  if (t > END_T - 0.35) { g.fillStyle = `rgba(255,255,255,${(t - (END_T - 0.35)) / 0.35 * 0.9})`; g.fillRect(0, 0, W, H); }   // 엔딩 직전 하얗게 번쩍(검은 화면 아님)
}
const CONF = (() => { const r = rng(7); return Array.from({ length: 90 }, () => ({ x: r() * W, y: -r() * H, v: 260 + r() * 380, s: 14 + r() * 18, rot: r() * 6, vr: (r() - .5) * 8, c: ['#ffd23f', '#ff7eb6', '#8fd3ff', '#4fe0a8', '#b98cff', '#ffffff'][Math.floor(r() * 6)] })); })();
function endScene(t) {
  const lt = t - END_T;
  const bg = g.createRadialGradient(W / 2, 760, 80, W / 2, 900, 1300); bg.addColorStop(0, '#6a4cf0'); bg.addColorStop(.5, '#3a2a7a'); bg.addColorStop(1, '#16122e'); g.fillStyle = bg; g.fillRect(0, 0, W, H);
  g.save(); g.translate(W / 2, 830); g.rotate(lt * 0.25); for (let i = 0; i < 16; i++) { g.rotate(Math.PI / 8); g.fillStyle = 'rgba(255,255,255,.06)'; g.beginPath(); g.moveTo(0, 0); g.lineTo(-90, -1500); g.lineTo(90, -1500); g.fill(); } g.restore();
  // 폰 화면(실제 홈 로비)
  const pu = eOut(lt / 0.6), ph = 1000, pw = ph * (IMG.home ? IMG.home.width / IMG.home.height : 0.46), px = W / 2 - pw / 2, py = 330 + (1 - pu) * 700 + Math.sin(lt * 2) * 6;
  g.save(); g.translate(W / 2, py + ph / 2); g.rotate(-0.045 * pu); g.translate(-W / 2, -(py + ph / 2));
  g.shadowColor = 'rgba(0,0,0,.55)'; g.shadowBlur = 60; g.shadowOffsetY = 24; g.fillStyle = '#0d0a1f'; rr(px - 20, py - 20, pw + 40, ph + 40, 64); g.fill(); g.shadowColor = 'transparent';
  g.save(); rr(px, py, pw, ph, 46); g.clip(); if (IMG.home) g.drawImage(IMG.home, px, py, pw, ph); g.restore();
  g.strokeStyle = 'rgba(255,255,255,.25)'; g.lineWidth = 4; rr(px - 20, py - 20, pw + 40, ph + 40, 64); g.stroke(); g.restore();
  // 캐릭터 둘
  if (lt > 0.5) { const u = (lt - 0.5) / 0.45, s = 0.2 + 0.8 * eBack(u), bob = Math.sin(lt * 5) * 14;
    g.save(); g.translate(855, 1250 + bob); g.scale(s, s); g.rotate(Math.sin(lt * 3) * 0.06); if (IMG.m1) g.drawImage(IMG.m1, -230, -230, 460, 460); g.restore(); }
  if (lt > 0.7) { const u = (lt - 0.7) / 0.45, s = 0.2 + 0.8 * eBack(u), bob = Math.sin(lt * 5 + 1.6) * 12;
    g.save(); g.translate(205, 1310 + bob); g.scale(-s, s); g.rotate(Math.sin(lt * 3 + 1) * 0.07); if (IMG.m3) g.drawImage(IMG.m3, -160, -160, 320, 320); g.restore(); }
  // 제목
  if (lt > 0.7) { txt('Play Mallow', W / 2, 150, 58, { weight: 800, alpha: slamA(t, END_T + 0.7), fill: '#cfe4ff' });
    txt('플레이말로우', W / 2, 250, 130, { scale: slamS(t, END_T + 0.7), alpha: slamA(t, END_T + 0.7), stroke: '#2a1466', grad: ['#ffffff', '#dcd2ff'] }); }
  // 주소 알약
  if (lt > 1.0) { const s = slamS(t, END_T + 1.0), a = slamA(t, END_T + 1.0), bw = 880, bh = 170, bx = W / 2 - bw / 2, by = 1500;
    g.save(); g.globalAlpha = a; g.translate(W / 2, by + bh / 2); g.scale(s, s); g.translate(-W / 2, -(by + bh / 2));
    g.shadowColor = 'rgba(0,0,0,.45)'; g.shadowBlur = 30; g.shadowOffsetY = 12; const pg = g.createLinearGradient(0, by, 0, by + bh); pg.addColorStop(0, '#ffe07a'); pg.addColorStop(1, '#ff9f43');
    g.fillStyle = pg; rr(bx, by, bw, bh, bh / 2); g.fill(); g.shadowColor = 'transparent';
    g.strokeStyle = '#fff6d0'; g.lineWidth = 6; rr(bx, by, bw, bh, bh / 2); g.stroke();
    g.save(); rr(bx, by, bw, bh, bh / 2); g.clip(); [1.4, 2.7].forEach(t0 => { const su = (lt - t0) / 0.6; if (su > 0 && su < 1) { const sx = bx - 200 + su * (bw + 400); const sg = g.createLinearGradient(sx - 120, 0, sx + 120, 0); sg.addColorStop(0, 'rgba(255,255,255,0)'); sg.addColorStop(.5, 'rgba(255,255,255,.75)'); sg.addColorStop(1, 'rgba(255,255,255,0)'); g.fillStyle = sg; g.fillRect(sx - 120, by, 240, bh); } }); g.restore();
    txt('playmallow.com', W / 2, by + bh / 2 + 4, 104, { fill: '#3a1a08', shadow: false }); g.restore(); }
  if (lt > 1.3) txt('무료 두뇌게임 · 가입·설치 없이 바로', W / 2, 1745, 52, { weight: 800, alpha: slamA(t, END_T + 1.3), fill: '#ffffff' });
  if (lt > 1.3) txt('34종 게임 · 매일 퍼즐 · 오늘의 운세', W / 2, 1830, 42, { weight: 700, alpha: slamA(t, END_T + 1.45) * .9, fill: '#cfc7ff' });
  // 색종이
  CONF.forEach(p => { const y = p.y + p.v * lt; if (y < -40 || y > H + 40) return; g.save(); g.translate(p.x + Math.sin(lt * 3 + p.rot) * 30, y); g.rotate(p.rot + p.vr * lt); g.fillStyle = p.c; g.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); g.restore(); });
  flash(t, END_T, .95);
}
window.renderFrame = (t) => { g.setTransform(1, 0, 0, 1, 0, 0); g.globalAlpha = 1;
  if (t < 1.5) hook(t); else if (t < WALL_T) games(t); else if (t < END_T) wallScene(t); else endScene(t);
  return cv.toDataURL('image/jpeg', 0.93); };

/* ===== 소리: 120BPM 드라이빙 트랙 + 컷마다 효과음. OfflineAudioContext로 15초를 한 번에 렌더 ===== */
window.renderAudio = async () => {
  const SR = 44100, A = new OfflineAudioContext(2, SR * DUR, SR);
  const comp = A.createDynamicsCompressor(); comp.threshold.value = -16; comp.knee.value = 10; comp.ratio.value = 4; comp.attack.value = .003; comp.release.value = .15;
  const lim = A.createDynamicsCompressor(); lim.threshold.value = -3; lim.ratio.value = 20; lim.attack.value = .001; lim.release.value = .05;
  const master = A.createGain(); master.gain.value = 1; comp.connect(lim); lim.connect(master); master.connect(A.destination);
  master.gain.setValueAtTime(1, 14.55); master.gain.linearRampToValueAtTime(0.0001, 15);   // 마지막 0.45초만 소리를 줄인다(화면은 끝까지 밝게)
  const verb = A.createConvolver(), len = SR * 1.4, ir = A.createBuffer(2, len, SR); const R = rng(3);
  for (let c = 0; c < 2; c++) { const d = ir.getChannelData(c); for (let i = 0; i < len; i++) d[i] = (R() * 2 - 1) * Math.pow(1 - i / len, 3); }
  verb.buffer = ir; const vg = A.createGain(); vg.gain.value = .22; verb.connect(vg); vg.connect(comp);
  const bus = A.createGain(); bus.gain.value = 1; bus.connect(comp); bus.connect(verb);
  const mus = A.createGain(); mus.gain.value = .62; mus.connect(comp);
  const NZ = A.createBuffer(1, SR, SR); { const d = NZ.getChannelData(0), r = rng(5); for (let i = 0; i < d.length; i++) d[i] = r() * 2 - 1; }
  const env = (gn, t, a, p, d) => { gn.gain.setValueAtTime(0.0001, t); gn.gain.linearRampToValueAtTime(p, t + a); gn.gain.exponentialRampToValueAtTime(0.0001, t + a + d); };
  const osc = (type, f, t, d, p, dst, o) => { o = o || {}; const x = A.createOscillator(), gn = A.createGain(); x.type = type; x.frequency.setValueAtTime(f, t);
    if (o.to) x.frequency.exponentialRampToValueAtTime(o.to, t + (o.gt || d)); if (o.det) x.detune.value = o.det; env(gn, t, o.a || .004, p, d); x.connect(gn); gn.connect(dst); x.start(t); x.stop(t + (o.a || .004) + d + .1); };

  impact(14.0, .55); [48, 60, 64, 67, 72].forEach(n => { osc('sawtooth', N(n), 14.0, 1.1, .05, mus, { a: .01, det: 6 }); bell(N(n + 12), 14.02, .06); });
