<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>말로우 사운드 데모 — 현재 vs 제안</title>
<style>
body{margin:0;font-family:system-ui,-apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;background:#15122e;color:#eee;padding:16px 14px 60px;line-height:1.5}
h1{font-size:1.25rem;margin:.2rem 0 .3rem}h2{font-size:1rem;margin:1.4rem 0 .5rem;color:#ffd27a}
p.note{font-size:.84rem;color:#bdb8dd;margin:.2rem 0 .8rem}
.row{display:grid;grid-template-columns:1fr auto auto;gap:6px;align-items:center;padding:7px 10px;border-radius:12px;background:#221d4a;margin-bottom:6px}
.row span{font-size:.9rem}.row small{display:block;color:#a9a3d6;font-size:.74rem}
button{font:inherit;font-weight:800;border:0;border-radius:10px;padding:.5rem .8rem;cursor:pointer;color:#fff}
.cur{background:#4b4870}.new{background:linear-gradient(180deg,#ff8f5e,#ef4f6d);box-shadow:0 3px 0 #a3304a}
.bgm{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:10px;border-radius:12px;background:#221d4a}
.bgm button{background:#3d62f0}.bgm button.on{background:#22a86f}
input[type=range]{width:160px}
.tag{display:inline-block;font-size:.7rem;padding:.05rem .45rem;border-radius:99px;background:#3a3470;color:#cfc8ff;margin-left:.3rem}
</style></head><body>
<h1>🔊 말로우 사운드 데모</h1>
<p class="note">회색 = 지금 사이트에서 나는 소리, 주황 = 제안 소리. 이어폰이나 스피커로 들어 보세요. 모든 소리는 음원 파일 없이 브라우저에서 합성됩니다.</p>

<h2>① 공통 피드백</h2>
<div id="common"></div>

<h2>② 적응형 배경음악 + 긴장</h2>
<div class="bgm">
  <button id="b-arcade" onclick="bgmToggle('arcade')">🏃 아케이드 드라이브</button>
  <button id="b-focus" onclick="bgmToggle('focus')">🧠 포커스 펄스(학습형)</button>
  <button id="b-puzzle" onclick="bgmToggle('puzzle')">🧩 퍼즐 칠</button>
  <label style="font-size:.82rem">강도 <input type="range" id="inten" min="0" max="2" step="1" value="0" oninput="BGM.level=+this.value"></label>
  <button style="background:#c8173a" onclick="finalCountdown()">⏱️ 마지막 10초 체험</button>
</div>
<p class="note">강도를 올리면 드럼·베이스·아르페지오가 겹쳐 쌓입니다. '마지막 10초'는 심장박동이 빨라지며 템포가 오르고 5초부터 틱이 높아집니다.</p>

<h2>③ 게임별 시그니처 예시</h2>
<div id="sig"></div>

<script>
let AC=null, M=null;
function ac(){ if(!AC){ AC=new (window.AudioContext||window.webkitAudioContext)(); buildMaster(); } if(AC.state==='suspended') AC.resume(); return AC; }
/* ── 제안 엔진: 효과음·음악 버스 → 리버브 센드 → 컴프레서·리미터 ── */
function buildMaster(){
  const comp=AC.createDynamicsCompressor(); comp.threshold.value=-18; comp.knee.value=12; comp.ratio.value=4; comp.attack.value=0.003; comp.release.value=0.18;
  const lim=AC.createDynamicsCompressor(); lim.threshold.value=-2; lim.ratio.value=20; lim.attack.value=0.001; lim.release.value=0.05;
  const out=AC.createGain(); out.gain.value=0.9; comp.connect(lim); lim.connect(out); out.connect(AC.destination);
  const verb=AC.createConvolver(); const len=AC.sampleRate*1.4, ir=AC.createBuffer(2,len,AC.sampleRate);
  for(let c=0;c<2;c++){ const d=ir.getChannelData(c); for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3.2); }
  verb.buffer=ir; const vg=AC.createGain(); vg.gain.value=0.22; verb.connect(vg); vg.connect(comp);
  const sfx=AC.createGain(); sfx.gain.value=1; sfx.connect(comp); sfx.connect(verb);
  const mus=AC.createGain(); mus.gain.value=0.55; mus.connect(comp); const ms=AC.createGain(); ms.gain.value=0.35; mus.connect(ms); ms.connect(verb);
  M={sfx,mus};
}
let NOISE=null; function noise(){ if(NOISE) return NOISE; const b=AC.createBuffer(1,AC.sampleRate,AC.sampleRate), d=b.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1; return NOISE=b; }
const J=(v,p=0.03)=>v*(1+(Math.random()*2-1)*p);   // 반복 기계감 줄이기
function env(g,t,a,peak,dec){ g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(peak,t+a); g.gain.exponentialRampToValueAtTime(0.0001,t+a+dec); }
function osc(type,f,t,dur,peak,dest,{a=0.004,glide=0,det=0}={}){ const o=AC.createOscillator(),g=AC.createGain(); o.type=type; o.frequency.setValueAtTime(f,t); if(glide) o.frequency.exponentialRampToValueAtTime(Math.max(20,f+glide),t+dur); o.detune.value=det; env(g,t,a,peak,dur); o.connect(g); g.connect(dest); o.start(t); o.stop(t+a+dur+0.05); return o; }
const V={
  pluck(f,t=0,vol=0.35,dest){ t+=ac().currentTime; dest=dest||M.sfx; const f0=J(f,0.004);
    const lp=AC.createBiquadFilter(); lp.type='lowpass'; lp.Q.value=4; lp.frequency.setValueAtTime(f0*9,t); lp.frequency.exponentialRampToValueAtTime(f0*1.5,t+0.25); lp.connect(dest);
    osc('sawtooth',f0,t,0.32,vol*0.5,lp); osc('triangle',f0*2,t,0.18,vol*0.35,lp); osc('sine',f0/2,t,0.2,vol*0.4,dest); },
  bell(f,t=0,vol=0.25,dest){ t+=ac().currentTime; dest=dest||M.sfx; [1,2.76,5.4].forEach((r,i)=>osc('sine',f*r,t,[1.1,0.6,0.3][i],vol*[1,0.4,0.2][i],dest)); },
  kick(t=0,vol=0.9,dest){ t+=ac().currentTime; dest=dest||M.sfx; osc('sine',150,t,0.28,vol,dest,{a:0.002,glide:-105}); hit(t-ac().currentTime,0.15,dest,3000,0.02); },
  snare(t=0,vol=0.35,dest){ t+=ac().currentTime; hit(t-ac().currentTime,vol,dest||M.sfx,1800,0.14,'bandpass'); osc('triangle',220,t,0.08,vol*0.5,dest||M.sfx,{glide:-60}); },
  hat(t=0,vol=0.12,dest){ hit(t,vol,dest||M.sfx,8000,0.04); },
  sub(t=0,vol=0.8){ t+=ac().currentTime; osc('sine',110,t,0.55,vol,M.sfx,{glide:-70}); osc('sawtooth',55,t,0.4,vol*0.25,M.sfx,{glide:-25}); },
  riser(dur=1.2,vol=0.25){ const t=ac().currentTime; const s=AC.createBufferSource(); s.buffer=noise(); s.loop=true; const bp=AC.createBiquadFilter(); bp.type='bandpass'; bp.Q.value=3; bp.frequency.setValueAtTime(300,t); bp.frequency.exponentialRampToValueAtTime(6000,t+dur); const g=AC.createGain(); g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+dur*0.95); g.gain.exponentialRampToValueAtTime(0.0001,t+dur+0.05); s.connect(bp); bp.connect(g); g.connect(M.sfx); s.start(t); s.stop(t+dur+0.1); osc('sawtooth',180,t,dur,vol*0.25,M.sfx,{a:dur*0.9,glide:700}); },
  whoosh(t=0,vol=0.35){ t+=ac().currentTime; const s=AC.createBufferSource(); s.buffer=noise(); const bp=AC.createBiquadFilter(); bp.type='bandpass'; bp.Q.value=1.2; bp.frequency.setValueAtTime(500,t); bp.frequency.exponentialRampToValueAtTime(2800,t+0.18); const g=AC.createGain(); env(g,t,0.05,vol,0.18); s.connect(bp); bp.connect(g); g.connect(M.sfx); s.start(t); s.stop(t+0.3); },
  glass(t=0){ for(let i=0;i<7;i++) V.bell(J(2400+Math.random()*2200,0.1),t+i*0.018+Math.random()*0.02,0.07); hit(t,0.3,M.sfx,5000,0.12); },
};
function hit(t,vol,dest,freq,dec,type='highpass'){ t+=ac().currentTime; const s=AC.createBufferSource(); s.buffer=noise(); const f=AC.createBiquadFilter(); f.type=type; f.frequency.value=freq; const g=AC.createGain(); env(g,t,0.001,vol,dec); s.connect(f); f.connect(g); g.connect(dest); s.start(t); s.stop(t+dec+0.05); }
const PENTA=[0,2,4,7,9]; const note=(i,base=523.25)=>base*Math.pow(2,(Math.floor(i/5)*12+PENTA[((i%5)+5)%5])/12);

/* ── 지금 사이트 소리(index.html sfx 그대로) ── */
function _tone(o){ const A=ac(), t=A.currentTime+(o.when||0), dur=o.dur||0.12, vol=o.vol||0.14; const g=A.createGain(); g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(vol,t+0.006); g.gain.exponentialRampToValueAtTime(0.001,t+dur); g.connect(A.destination);
  [1,2].forEach((m,i)=>{ const x=A.createOscillator(); x.type=o.type||'sine'; x.frequency.setValueAtTime(o.freq*m,t); if(o.glide) x.frequency.exponentialRampToValueAtTime(Math.max(30,o.freq*m+o.glide),t+dur); const og=A.createGain(); og.gain.value=i?0.32:1; x.connect(og); og.connect(g); x.start(t); x.stop(t+dur+0.05); });
  if(o.noise){ const s=A.createBufferSource(); s.buffer=noise(); const nf=A.createBiquadFilter(); nf.type='highpass'; nf.frequency.value=o.noiseFreq||1800; const ng=A.createGain(); ng.gain.setValueAtTime(vol*o.noise,t); ng.gain.exponentialRampToValueAtTime(0.001,t+Math.min(dur,0.09)); s.connect(nf); nf.connect(ng); ng.connect(A.destination); s.start(t); s.stop(t+0.12); } }
const CUR={
  good:()=>{ _tone({freq:740,dur:0.09,type:'triangle',vol:0.15,noise:0.18,noiseFreq:3000}); _tone({freq:988,dur:0.12,vol:0.13,when:0.06}); },
  bad:()=>{ _tone({freq:220,dur:0.2,type:'square',vol:0.09,glide:-110}); _tone({freq:147,dur:0.22,vol:0.1,when:0.04}); },
  win:()=>[523,659,784,1047].forEach((f,i)=>_tone({freq:f,dur:i===3?0.34:0.11,type:'triangle',vol:0.13,when:i*0.09})),
  record:()=>{ [523,659,784,1047,1319].forEach((f,i)=>_tone({freq:f,dur:i>=3?0.3:0.1,type:'triangle',vol:0.12,when:i*0.08})); _tone({freq:2093,dur:0.5,vol:0.05,when:0.36}); },
  tick:()=>_tone({freq:1100,dur:0.04,vol:0.07,noise:0.4,noiseFreq:5000}),
  jump:()=>_tone({freq:360,dur:0.13,type:'square',vol:0.05,glide:420}),
};
const seqCur=(fn,n,gap)=>{ for(let i=0;i<n;i++) setTimeout(fn,i*gap); };

/* ── 제안 공통 문법 ── */
const NEW={
  combo(c){ const i=Math.min(c-1,14); V.pluck(note(i),0,0.34); V.bell(note(i+5)*2,0.03,0.06); if(c===5||c===10){ [0,4,7,12].forEach((s,k)=>V.pluck(note(i)*Math.pow(2,s/12),0.12+k*0.06,0.26)); V.hat(0.1,0.2);} },
  bad(){ V.kick(0,0.8); osc('sawtooth',J(116),ac().currentTime,0.22,0.12,M.sfx,{det:-35,glide:-30}); osc('sawtooth',J(123),ac().currentTime,0.22,0.1,M.sfx,{det:25,glide:-30}); },
  broke(){ V.glass(0); [7,4,2,0].forEach((d,k)=>V.pluck(note(d,392),0.08+k*0.07,0.18)); },
  countdown(){ [0,0.7,1.4].forEach(t=>{ V.kick(t,0.5); V.bell(660,t,0.18); }); V.riser(0.7,0.18); setTimeout(()=>{ V.kick(0,1); V.snare(0,0.5); [0,4,7,12].forEach(s=>V.pluck(523.25*Math.pow(2,s/12),0,0.22)); },2100); },
  timeup(){ const t=ac().currentTime; osc('sawtooth',440,t,0.9,0.18,M.sfx,{glide:-330}); V.sub(0.05,0.9); V.bell(98,0.1,0.5); hit(0.1,0.25,M.sfx,400,0.9,'lowpass'); },
  record(){ V.riser(0.6,0.2); setTimeout(()=>{ V.kick(0,1); V.snare(0,0.5); [0,4,7,12,16,19].forEach((s,k)=>V.pluck(523.25*Math.pow(2,s/12),k*0.07,0.28)); [0,4,7].forEach(s=>V.bell(1046.5*Math.pow(2,s/12),0.45,0.12)); for(let k=0;k<10;k++) V.bell(J(3000+k*180,0.1),0.5+k*0.04,0.04); },600); },
  medal(k){ const L={bronze:[0,4,7],silver:[0,4,7,12],gold:[0,4,7,12,16],diamond:[0,4,7,11,14,19,24]}[k]; const b=k==='diamond'?587.33:523.25;
    L.forEach((s,i)=>{ V.pluck(b*Math.pow(2,s/12),i*0.075,0.26); V.bell(b*2*Math.pow(2,s/12),i*0.075+0.02,k==='diamond'?0.1:0.05); }); if(k==='gold'||k==='diamond') V.kick(0,0.7); if(k==='diamond'){ V.riser(0.5,0.12); for(let i=0;i<14;i++) V.bell(J(2500+i*230,0.08),0.55+i*0.035,0.05);} },
  deadline(){ for(let i=0;i<6;i++) setTimeout(()=>{ hit(0,0.22,M.sfx,6000,0.03); osc('square',1200+i*120,ac().currentTime,0.025,0.05,M.sfx); },i*110); },
};

/* ── 시그니처 ── */
const SIG={
  runJump(){ V.whoosh(0,0.3); const t=ac().currentTime; osc('triangle',260,t,0.16,0.3,M.sfx,{glide:520}); },
  runLand(){ V.kick(0,0.45); hit(0,0.12,M.sfx,900,0.06,'lowpass'); },
  runCrash(){ V.kick(0,1); V.snare(0,0.6); V.sub(0.02,0.9); V.glass(0.05); },
  runMilestone(){ V.bell(1318.5,0,0.2); V.bell(1760,0.09,0.18); },
  chopBite(){ hit(0,0.4,M.sfx,1200,0.05,'bandpass'); V.kick(0,0.35); osc('square',J(180,0.1),ac().currentTime,0.05,0.08,M.sfx,{glide:-60}); },
  whackPop(){ const t=ac().currentTime; osc('sine',300,t,0.14,0.3,M.sfx,{glide:500}); },
  whackBonk(c){ V.kick(0,0.6); V.pluck(note(Math.min(c-1,12),392),0.01,0.3); },
  bomb(){ V.sub(0,1); hit(0,0.6,M.sfx,300,0.6,'lowpass'); hit(0,0.3,M.sfx,3000,0.2); },
  mergePop(v){ const s=Math.log2(v); V.pluck(196*Math.pow(2,s/4),0,0.32); const t=ac().currentTime; osc('sine',120+s*20,t,0.12,0.25,M.sfx,{glide:160}); },
  lineClear(n){ V.whoosh(0,0.35); for(let i=0;i<n;i++) [0,4,7].forEach(s=>V.pluck(392*Math.pow(2,(s+i*5)/12),0.06+i*0.08,0.2)); },
  trailNode(i){ V.pluck(note(i,392),0,0.3); },
  sudokuUnit(){ [0,7,12,16].forEach((s,k)=>V.bell(784*Math.pow(2,s/12),k*0.05,0.12)); },
  soarTrace(p){ const t=ac().currentTime; osc('triangle',220+p*440,t,0.25,0.14,M.sfx,{a:0.05}); },
};

const rows=[
  ['정답 1회','같은 소리 ↔ 한 음',()=>CUR.good(),()=>NEW.combo(1)],
  ['정답 연속 10콤보','지금은 10번 모두 같은 음 · 제안은 계단처럼 올라가고 5·10콤보에 팡파르',()=>seqCur(CUR.good,10,260),()=>{ for(let c=1;c<=10;c++) setTimeout(()=>NEW.combo(c),(c-1)*260); }],
  ['오답','',()=>CUR.bad(),()=>NEW.bad()],
  ['콤보 끊김(5 이상)','지금은 소리 없음(오답음만)',()=>CUR.bad(),()=>{ NEW.bad(); setTimeout(NEW.broke,120); }],
  ['시작 카운트다운','지금은 없음(만들어만 두고 호출 0회)',()=>{},()=>NEW.countdown()],
  ['어려움 문항 제한시간 임박','',()=>{},()=>NEW.deadline()],
  ['타임업·게임오버','',()=>CUR.win(),()=>NEW.timeup()],
  ['신기록','',()=>CUR.record(),()=>NEW.record()],
  ['메달 🥉','',()=>CUR.win(),()=>NEW.medal('bronze')],
  ['메달 🥈','',()=>CUR.win(),()=>NEW.medal('silver')],
  ['메달 🥇','',()=>CUR.win(),()=>NEW.medal('gold')],
  ['메달 💎','',()=>CUR.win(),()=>NEW.medal('diamond')],
];
const sig=[
  ['말로우 런 · 점프 → 착지','',()=>CUR.jump(),()=>{ SIG.runJump(); setTimeout(SIG.runLand,560); }],
  ['말로우 런 · 충돌','',()=>CUR.bad(),()=>SIG.runCrash()],
  ['말로우 런 · 100m 돌파','',()=>{},()=>SIG.runMilestone()],
  ['말로우 타워 · 깨물기 ×6','',()=>seqCur(()=>_tone({freq:740,dur:0.05,type:'square',vol:0.12}),6,220),()=>{ for(let i=0;i<6;i++) setTimeout(SIG.chopBite,i*220); }],
  ['말로우 팡팡 · 등장 → 맞힘 ×5','',()=>seqCur(CUR.good,5,420),()=>{ for(let c=1;c<=5;c++){ setTimeout(SIG.whackPop,(c-1)*420); setTimeout(()=>SIG.whackBonk(c),(c-1)*420+200); } }],
  ['말로우 팡팡 · 폭탄','',()=>CUR.bad(),()=>SIG.bomb()],
  ['말랑 2048 · 합치기 4→256','',()=>seqCur(CUR.good,4,330),()=>[4,16,64,256].forEach((v,i)=>setTimeout(()=>SIG.mergePop(v),i*330))],
  ['블록 채우기 · 두 줄 삭제','',()=>CUR.good(),()=>SIG.lineClear(2)],
  ['순서 잇기 · 1→7 누르기','',()=>seqCur(CUR.good,7,230),()=>{ for(let i=0;i<7;i++) setTimeout(()=>SIG.trailNode(i),i*230); }],
  ['스도쿠 · 행 완성','지금은 소리 없음',()=>{},()=>SIG.sudokuUnit()],
  ['길 따라가기 · 진행','지금은 소리 없음',()=>{},()=>{ for(let i=0;i<12;i++) setTimeout(()=>SIG.soarTrace(i/11),i*120); }],
];
function render(id,list){ const el=document.getElementById(id); list.forEach(([t,sub,a,b])=>{ const r=document.createElement('div'); r.className='row';
  r.innerHTML='<span>'+t+(sub?'<small>'+sub+'</small>':'')+'</span>'; const x=document.createElement('button'); x.className='cur'; x.textContent='현재'; x.onclick=()=>{ ac(); a(); };
  const y=document.createElement('button'); y.className='new'; y.textContent='제안'; y.onclick=()=>{ ac(); b(); }; r.append(x,y); el.appendChild(r); }); }
render('common',rows); render('sig',sig);

/* ── 적응형 배경음악 (스케줄러) ── */
const BGM={on:null,level:0,bpm:108,step:0,next:0,timer:0,urgent:0};
const PROG={arcade:[[0,7,12],[-4,3,8],[-7,0,5],[-2,5,10]], focus:[[0,3,7],[-4,0,3],[-7,-3,0],[-5,-2,2]], puzzle:[[0,4,11],[5,9,16],[2,5,12],[7,11,14]]};
function bgmToggle(k){ ac(); if(BGM.on===k){ bgmStop(); return; } bgmStop(); BGM.on=k; BGM.bpm={arcade:118,focus:100,puzzle:78}[k]; BGM.step=0; BGM.next=AC.currentTime+0.05; BGM.timer=setInterval(bgmTick,25); document.getElementById('b-'+k).classList.add('on'); }
function bgmStop(){ clearInterval(BGM.timer); if(BGM.on) document.getElementById('b-'+BGM.on).classList.remove('on'); BGM.on=null; BGM.urgent=0; }
function bgmTick(){ while(BGM.next<AC.currentTime+0.12){ play16(BGM.step,BGM.next-AC.currentTime); BGM.next+=60/BGM.bpm/4; BGM.step++; } }
function play16(s,t){ const k=BGM.on, L=BGM.level, bar=Math.floor(s/16)%4, i=s%16, ch=PROG[k][bar], root=k==='puzzle'?261.63:k==='focus'?220:246.94, D=M.mus;
  const f=n=>root*Math.pow(2,n/12);
  if(k==='puzzle'){ if(i%8===0) ch.forEach(n=>V.bell(f(n),t,0.05,D)); if(i%4===2&&Math.random()<0.6) V.pluck(f(ch[(i/2)%3|0]+12),t,0.06,D); if(L>=1&&i%8===4) V.hat(t,0.04,D); if(L>=2&&i%16===0) V.kick(t,0.25,D); return; }
  if(i%4===0) V.kick(t,k==='focus'?0.55:0.8,D);
  if(i===0) ch.forEach(n=>osc('sawtooth',f(n)/2,AC.currentTime+t,60/BGM.bpm*4*0.95,0.025,D,{a:0.3}));   // 패드
  if(i%2===0) osc('sawtooth',f(ch[0])/4,AC.currentTime+t,0.12,k==='focus'?0.07:0.1,D);                     // 베이스 맥박
  if(L>=1){ if(i%4===2) V.hat(t,0.08,D); if(i===4||i===12) V.snare(t,0.22,D); }
  if(L>=2){ V.pluck(f(ch[i%3]+12+(i%8>=4?12:0)),t,0.07,D); if(i%2===1) V.hat(t,0.05,D); }
  if(BGM.urgent&&i%2===0) V.hat(t,0.1,D);
}
function finalCountdown(){ ac(); if(!BGM.on) bgmToggle('focus'); BGM.level=2; document.getElementById('inten').value=2; BGM.urgent=1; const base=BGM.bpm;
  for(let s=10;s>=1;s--){ const at=(10-s)*1000; setTimeout(()=>{ BGM.bpm=base*(1+(10-s)*0.035); const n=s<=3?3:s<=6?2:1;          // 심장박동: 점점 빨라짐
      for(let k=0;k<n;k++){ V.kick(k*(1/n)*0.9,0.9); V.kick(k*(1/n)*0.9+0.14,0.5); }
      if(s<=5){ hit(0,0.25,M.sfx,6000,0.03); osc('square',900+(6-s)*180,ac().currentTime,0.05,0.06,M.sfx); } },at); }
  setTimeout(()=>{ bgmStop(); BGM.bpm=base; NEW.timeup(); },10000); }
</script>
